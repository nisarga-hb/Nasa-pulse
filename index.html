<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nasa pulse</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <div id="sidebar">
      <div id="clock"></div>
      <div id="weather-form">
        <input type="text" id="city-input" placeholder="enter city..." />
        <button id="city-btn">go</button>
      </div>
      <div id="weather"></div>
    </div>

    <div id="main">
      <div class="controls">
        <label for="datepicker">pick a date:</label>
        <input type="date" id="datepicker" />
      </div>
      <div id="app"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
